  - _id: E8D2TvongEyUTNSp
    name: As a Mini Game in Another World
    type: text
    title:
      show: true
      level: 1
    text:
      content: '<h2>The Mini Game</h2> <p>Penny Dreadful runs here as a mini game inside your campaign: a horror interlude on its own board. Nothing happens in the campaign until the Director starts it, and ending it closes the board on every screen. The host campaign&#39;s own actors and chat are left alone.</p> <h2>For the Director</h2> <ul> <li><strong>Start the game:</strong> click the coins in the Token controls on the left. The board opens for every player, and each connected player without a PC gets one. With no scene active the coins are not there: press Alt+B to open your board and choose <strong>Start the Penny Dreadful Mini Game</strong> from its header menu (⋮), or use Configure Settings → Penny Dreadful Mini Game Running.</li> <li><strong>Closed your board?</strong> Click the coins or press Alt+B to bring it back. The coins never end the game.</li> <li><strong>End the game:</strong> the board&#39;s header menu (⋮) → <strong>End the Penny Dreadful Mini Game</strong>. It asks first. Nothing is deleted: start again and the board is as you left it.</li> <li><strong>Ask for a flip:</strong> click a DS number (1 to 5) on a row. The card goes to chat and the row is spotlit. Click the same number again to withdraw the ask. A DS above the pennies a row holds cannot be asked.</li> <li><strong>Pennies:</strong> − and + on a row change its hand. Minus on a dead row brings it back to life first.</li> <li><strong>Spotlight:</strong> the star on a row, or the next-row button in the toolbar.</li> <li><strong>Add a PC or NPC:</strong> the person-plus and stranger buttons in the toolbar. The slashed-person button on a row takes it off the board; nothing is deleted, and you can add it back.</li> <li><strong>Who plays a PC:</strong> open the PC (click its name) and choose the Player.</li> <li><strong>A new one-shot:</strong> the clapperboard. It deletes every Penny Dreadful PC and the mini game&#39;s own chat messages, benches the NPCs, and makes a fresh PC for each connected player.</li> <li>In the Actors tab, the mini game&#39;s actors are marked (PC-PD) and (NPC-PD).</li> </ul> <h2>For Players</h2> <ul> <li>When the Director starts the game, the board opens and you get a PC named after you. Click your own name on the board to change your character&#39;s name.</li> <li>When the Director asks you to flip, a card appears in the chat with a <strong>Flip</strong> button, and the same button appears on your row. Click it once.</li> <li>Heads count toward the Difficulty Score (DS). Meet or beat it and you succeed. Fail and you gain a penny. Failing while holding ten pennies is the end of your character.</li> <li>You can close your board with its X; Alt+B brings it back while the game is running.</li> </ul> <h2>The Toolbar</h2> <ul> <li>Book: the rules.</li> <li>Percent: the odds of every flip.</li> <li>Question mark: this guide.</li> </ul>'
