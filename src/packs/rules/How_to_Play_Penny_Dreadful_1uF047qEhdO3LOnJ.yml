name: How to Play Penny Dreadful
pages:
  - _id: 773F5ibbyXtegfMx
    name: In a Penny Dreadful World
    type: text
    title:
      show: true
      level: 1
    text:
      content: '<h2>The Board</h2> <p>The Penny Dreadful board is the game&#39;s home. It stays open on every screen: drag it by its title bar, pop it out into its own window from its header menu (⋮), and make it bigger or smaller with the magnifier dropdown.</p> <p>Each row is a character: their name, their pennies, and a skull if they are dead. PCs come first, then NPCs. The gold star marks whose turn it is.</p> <h2>For Players</h2> <ul> <li>You get a PC named after you when you join. Click your own name on the board to change your character&#39;s name.</li> <li>When the Director asks you to flip, a card appears in the chat with a <strong>Flip</strong> button, and the same button appears on your row. Click it once.</li> <li>Heads count toward the Difficulty Score (DS). Meet or beat it and you succeed. Fail and you gain a penny. Failing while holding ten pennies is the end of your character.</li> </ul> <h2>For the Director</h2> <ul> <li><strong>Ask for a flip:</strong> click a DS number (1 to 5) on a row. The card goes to chat and the row is spotlit. Click the same number again to withdraw the ask. A DS above the pennies a row holds cannot be asked.</li> <li><strong>Pennies:</strong> − and + on a row change its hand. Minus on a dead row brings it back to life first.</li> <li><strong>Spotlight:</strong> the star on a row, or the next-row button in the toolbar.</li> <li><strong>Add a PC or NPC:</strong> the person-plus and stranger buttons in the toolbar. The slashed-person button on a row takes it off the board; nothing is deleted, and you can add it back.</li> <li><strong>Who plays a PC:</strong> open the PC (click its name) and choose the Player.</li> <li><strong>A new one-shot:</strong> the clapperboard. It deletes every PC, clears the chat, benches the NPCs, and makes a fresh PC for each connected player.</li> <li><strong>Settings:</strong> the NPC Penny Limit (5 to 10) and automatic PCs are in Configure Settings → Penny Dreadful.</li> </ul> <h2>The Toolbar</h2> <ul> <li>Book: the rules.</li> <li>Percent: the odds of every flip.</li> <li>Question mark: this guide.</li> </ul> <p>Alt+B brings the board back if it is ever lost.</p>'
