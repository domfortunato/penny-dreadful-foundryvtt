name: How to Play Penny Dreadful
pages:
  - _id: 773F5ibbyXtegfMx
    name: In a Penny Dreadful World
    type: text
    title:
      show: true
      level: 1
    text:
      content: '<h2 id="pd-howto-the-penny-dreadful-dashboard">The Penny Dreadful Dashboard</h2> <p>This world plays Penny Dreadful: a dreadful, horrific game played by flipping pennies! The board opens on every screen when you join.</p> <ul> <li>Players can skip the Director&#39;s section: <a class="pd-link" role="button" tabindex="0" data-action="scrollTo" data-pd-scroll="pd-howto-for-players">click here</a> to learn how to use the dashboard.</li> <li>Anyone can read <a class="pd-link" role="button" tabindex="0" data-action="openRules" data-pd-open="rules">Penny Dreadful&#39;s rules</a>. The book icon on the board opens them too.</li> </ul> <h2 id="pd-howto-for-the-director">For the Director</h2> <p>In Penny Dreadful the game master is called the Director, and this world renames Foundry&#39;s Game Master role to match. Here is what the Director needs to know:</p> <ul> <li><strong>Dice So Nice is recommended.</strong> It isn&#39;t required, but with that module active the pennies tumble across every screen on each flip, and the board gains the hold and clear buttons described below. Try it, you&#39;ll like it!</li> <li><strong>PCs for the players:</strong> every player gets a Penny Dreadful character named after them the first time they connect, in the Actors tab&#39;s Penny Dreadful folder and marked (PC-PD).</li> <li><strong>Closed your board with the X?</strong> Click the coins in the Token controls on the left, or press Alt+B, to bring it back.</li> <li><strong>Ask a player for a flip:</strong> click a DS number (1 to 5) on their row. The ask goes to chat as a card with a Flip button, and the row is spotlit. Click the same number again to withdraw it. A DS higher than the pennies the row holds can&#39;t be asked, because it couldn&#39;t be met.</li> <li><strong>Add or remove pennies by hand:</strong> − and + on a row. Minus on a dead row brings the character back to life first.</li> <li><strong>Spotlight:</strong> the star on a row, or the skip-forward button in the toolbar to spotlight the next row.</li> <li><strong>Add a PC or NPC:</strong> the person-plus (PC) and stranger (NPC) buttons in the toolbar. NPCs land in the Penny Dreadful folder too, marked (NPC-PD). The slashed-person button on a row takes the character off the board; nothing is deleted, and you can add it back.</li> <li><strong>Choose who plays a PC, or rename a character:</strong> click its name on the board to open it, then pick the Player or edit the name (25 characters at most).</li> <li><strong>Hold the pennies on screen:</strong> with Dice So Nice active, the push-pin toggle keeps each flip&#39;s pennies on every screen for dramatic effect until you sweep them away with the broom.</li> <li><strong>Clear the cast for a new one-shot:</strong> the clapperboard deletes every PC, clears the chat log, benches the NPCs, and makes a fresh PC for each connected player. It asks first.</li> <li><strong>What are the chances?</strong> The % icon opens <a class="pd-link" role="button" tabindex="0" data-action="openOdds" data-pd-open="odds">a table of the odds</a> of success for every DS against the pennies in a player&#39;s hand.</li> <li><strong>Settings:</strong> the NPC Penny Limit (5 to 10) and automatic PCs are in Configure Settings → Penny Dreadful.</li> </ul> <h2 id="pd-howto-for-players">For Players</h2> <ul> <li>You get a PC named after you when you join. Click your own name on the board to change your character&#39;s name.</li> <li>When the Director asks you to flip, a card appears in the chat with a <strong>Flip</strong> button, and the same button appears on your row. Click it once.</li> <li>Heads count toward the Difficulty Score (DS). Meet or beat it and you succeed. Fail and you gain a penny. Failing while holding ten pennies is the end of your character. <a class="pd-link" role="button" tabindex="0" data-action="openRules" data-pd-open="rules">The rules</a> have the rest, and <a class="pd-link" role="button" tabindex="0" data-action="openOdds" data-pd-open="odds">the odds table</a> shows your chances.</li> <li>You can close your board with its X; Alt+B or the coins in the Token controls bring it back.</li> </ul>'
