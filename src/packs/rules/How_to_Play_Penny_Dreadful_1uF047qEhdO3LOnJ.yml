    text:
      content: '<h2 id="pd-howto-the-penny-dreadful-dashboard">The Penny Dreadful Dashboard</h2> <p>Penny Dreadful runs here as a mini game inside your campaign: a dreadful, horrific interlude played by flipping pennies!</p> <ul> <li>Players can skip the Director&#39;s section: <a class="pd-link" role="button" tabindex="0" data-action="scrollTo" data-pd-scroll="pd-howto-for-players">click here</a> to learn how to use the dashboard.</li> <li>Anyone can read <a class="pd-link" role="button" tabindex="0" data-action="openRules" data-pd-open="rules">Penny Dreadful&#39;s rules</a>. The book icon on the board opens them too.</li> </ul> <h2 id="pd-howto-for-the-director">For the Director</h2> <p>In Penny Dreadful the game master is called the Director. Here is what the Director needs to know:</p> <ul> <li><strong>Dice So Nice is recommended.</strong> It isn&#39;t required, but with that module active the pennies tumble across every screen on each flip, and the board gains the hold and clear buttons described below. Try it, you&#39;ll like it!</li> <li><strong>Start the game:</strong> click the coins in the Token controls on the left, and the board opens for you and every player. The coins do nothing without an active scene; then press Alt+B to open your board and choose <strong>Start the Penny Dreadful Mini Game</strong> from its header menu (⋮), or use Configure Settings → Penny Dreadful Mini Game Running.</li> <li><strong>PCs for the players:</strong> when the game starts, every connected player who has no Penny Dreadful character yet gets one, named after them, in the Actors tab&#39;s Penny Dreadful folder and marked (PC-PD). Anyone who connects while the game runs gets one too.</li> <li><strong>Closed your board with the X?</strong> Click the coins or press Alt+B to bring it back. The coins never end the game.</li> <li><strong>End the game:</strong> the board&#39;s header menu (⋮) → <strong>End the Penny Dreadful Mini Game</strong>. It asks first. Nothing is deleted: start again and the board is as you left it.</li> <li><strong>Ask a player for a flip:</strong> click a DS number (1 to 5) on their row. The ask goes to chat as a card with a Flip button, and the row is spotlit. Click the same number again to withdraw it. A DS higher than the pennies the row holds can&#39;t be asked, because it couldn&#39;t be met.</li> <li><strong>Add or remove pennies by hand:</strong> − and + on a row. Minus on a dead row brings the character back to life first.</li> <li><strong>Spotlight:</strong> the star on a row, or the skip-forward button in the toolbar to spotlight the next row.</li> <li><strong>Add a PC or NPC:</strong> the person-plus (PC) and stranger (NPC) buttons in the toolbar. NPCs land in the Penny Dreadful folder too, marked (NPC-PD). The slashed-person button on a row takes the character off the board; nothing is deleted, and you can add it back.</li> <li><strong>Choose who plays a PC, or rename a character:</strong> click its name on the board to open it, then pick the Player or edit the name (25 characters at most).</li> <li><strong>Hold the pennies on screen:</strong> with Dice So Nice active, the push-pin toggle keeps each flip&#39;s pennies on every screen for dramatic effect until you sweep them away with the broom.</li> <li><strong>Clear the cast for a new one-shot:</strong> the clapperboard deletes every Penny Dreadful PC and the mini game&#39;s own chat messages, benches the NPCs, and makes a fresh PC for each connected player. It asks first.</li> <li><strong>What are the chances?</strong> The % icon opens <a class="pd-link" role="button" tabindex="0" data-action="openOdds" data-pd-open="odds">a table of the odds</a> of success for every DS against the pennies in a player&#39;s hand.</li> </ul> <h2 id="pd-howto-for-players">For Players</h2> <ul> <li>When the Director starts the game, the board opens and you get a PC named after you. Click your own name on the board to change your character&#39;s name.</li> <li>When the Director asks you to flip, a card appears in the chat with a <strong>Flip</strong> button, and the same button appears on your row. Click it once.</li> <li>Heads count toward the Difficulty Score (DS). Meet or beat it and you succeed. Fail and you gain a penny. Failing while holding ten pennies is the end of your character. <a class="pd-link" role="button" tabindex="0" data-action="openRules" data-pd-open="rules">The rules</a> have the rest, and <a class="pd-link" role="button" tabindex="0" data-action="openOdds" data-pd-open="odds">the odds table</a> shows your chances.</li> <li>You can close your board with its X; Alt+B or the coins in the Token controls bring it back while the game is running.</li> </ul>'
