{{!-- The add-to-the-board dialog, one template for both types: `labels` carries the type's keys. --}}
<div>
    {{#if candidates.length}}
        <div class="form-group">
            <label>{{localize labels.pick}}</label>
            <div class="form-fields">
                <select name="actor">
                    <option value=""></option>
                    {{#each candidates}}
                        <option value="{{id}}">{{label}}</option>
                    {{/each}}
                </select>
            </div>
        </div>
    {{else}}
        <p class="hint">{{localize labels.none}}</p>
    {{/if}}
    <div class="form-group">
        <label>{{localize labels.create}}</label>
        <div class="form-fields">
            <input type="text" name="newName" maxlength="{{nameMax}}" placeholder="{{localize 'PD.Dialog.AddPlaceholder'}}">
        </div>
    </div>
</div>
