{{!-- One root element. The sheet itself is the <form>; this is its content. --}}
<div class="pd-sheet-body standard-form">
    <div class="form-group">
        <label>{{localize 'PD.Sheet.Name'}}</label>
        <div class="form-fields">
            <input type="text" name="name" value="{{document.name}}" {{#unless editable}}disabled{{/unless}}>
        </div>
    </div>
    {{#unless isNpc}}
        <div class="form-group">
            <label>{{localize 'PD.Sheet.Player'}}</label>
            <div class="form-fields">
                <span class="pd-readonly">{{#if playerName}}{{playerName}}{{else}}{{localize 'PD.Sheet.NoPlayer'}}{{/if}}</span>
            </div>
        </div>
    {{/unless}}
    <div class="form-group">
        <label>{{localize 'PD.Sheet.Pennies'}}</label>
        <div class="form-fields">
            <input type="number" name="system.pennies" value="{{system.pennies}}" min="1" max="{{maxPennies}}" step="1"
                   {{#unless editable}}disabled{{/unless}}>
        </div>
    </div>
    <div class="form-group">
        <label>{{localize 'PD.Sheet.Dead'}}</label>
        <div class="form-fields">
            <input type="checkbox" name="system.dead" {{checked system.dead}} {{#unless editable}}disabled{{/unless}}>
        </div>
    </div>
    {{!-- Board membership is the Director's call, for characters and NPCs alike. --}}
    {{#if isDirector}}
        <div class="form-group">
            <label>{{localize 'PD.Sheet.OnBoard'}}</label>
            <div class="form-fields">
                <input type="checkbox" name="system.onBoard" {{checked system.onBoard}} {{#unless editable}}disabled{{/unless}}>
            </div>
        </div>
    {{/if}}
</div>
